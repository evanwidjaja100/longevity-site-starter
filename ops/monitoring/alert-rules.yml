groups:
  - name: longevity-governance
    rules:
      # Counters are lifetime wp_options values exported as Prometheus
      # counters. Alerts use increase() windows so one historical increment
      # cannot page forever and counter resets stay safe (PRV3-OBS-01).
      - alert: LongevityAuditWriteFailures
        expr: increase(lel_audit_write_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Governance audit-log write failures detected"
          description: "lel_audit_write_failures_total increased by {{ $value }} in 15m. The append-only audit chain may be dropping mandatory events. Investigate DB availability and the audit table immediately."
          runbook: "operations/runbooks/audit-chain-integrity-failure.md"

      - alert: LongevityPublicationLockExhaustion
        expr: increase(lel_publication_lock_failures_total[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Publication lock acquisition failures"
          description: "lel_publication_lock_failures_total increased by {{ $value }} in 30m. Approval and invalidation flows may be contending or GET_LOCK may be unsupported."
          runbook: "operations/runbooks/lock-exhaustion.md"

      - alert: LongevityReadinessDegraded
        expr: lel_readiness_overall < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "System readiness is not OK"
          description: "lel_readiness_overall={{ $value }} (1 ok, 0.5 degraded, 0 blocked). Inspect the per-check one-hot gauges lel_readiness_check_state{check,state} to find the failing subsystem."
          runbook: "docs/operations/incident-response.md"

      - alert: LongevityReadinessBlocked
        expr: lel_readiness_overall == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "System readiness is BLOCKED"
          description: "A blocking readiness check failed (database, migrations, scoring model, approval/audit tables, or uploads). See lel_readiness_check_state{state=\"blocked\"}."
          runbook: "operations/runbooks/database-unavailable.md"

      - alert: LongevityInvalidationFallbackFailures
        expr: increase(lel_invalidation_fallback_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Synchronous invalidation fallback failures"
          description: "The invalidation queue table is likely absent and direct invalidation is failing. Ensure migrations have run."
          runbook: "operations/runbooks/invalidation-fallback-failure.md"

  - name: longevity-inhibition-contract
    rules: []
    # Alertmanager inhibition contract: LongevityReadinessBlocked (critical)
    # inhibits LongevityReadinessDegraded (warning) for the same instance so a
    # blocked system pages once, not twice. Configure in alertmanager.yml:
    #   inhibit_rules:
    #     - source_matchers: [ alertname = LongevityReadinessBlocked ]
    #       target_matchers: [ alertname = LongevityReadinessDegraded ]
    #       equal: [ instance ]
