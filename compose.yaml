name: longevity-site

services:
  db:
    image: mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b # mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    security_opt:
      - no-new-privileges:true

  wordpress:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    image: longevity-wordpress:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-local}' );
        define( 'WP_DEBUG_LOG', ${WP_DEBUG_LOG:-false} );
        define( 'WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY:-false} );
        define( 'FORCE_SSL_ADMIN', ${FORCE_SSL_ADMIN:-false} );
        define( 'DISALLOW_FILE_MODS', ${DISALLOW_FILE_MODS:-false} );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_AUTO_UPDATE_CORE', 'minor' );
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
        define( 'AUTOSAVE_INTERVAL', 120 );
        define( 'WP_POST_REVISIONS', 30 );
        define( 'EMPTY_TRASH_DAYS', 14 );
        define( 'WP_REDIS_HOST', '${WP_REDIS_HOST:-redis}' );
        define( 'WP_REDIS_PORT', ${WP_REDIS_PORT:-6379} );
        define( 'WP_REDIS_TIMEOUT', 1 );
        define( 'WP_REDIS_READ_TIMEOUT', 1 );
        define( 'WP_CACHE', true );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80,$$e,$$m,2); exit($$s?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7 # redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  wpcli:
    build:
      context: .
      dockerfile: docker/development/Dockerfile.wpcli
    image: longevity-wpcli:dev
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WP_SITE_URL: ${WP_SITE_URL}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      WP_TIMEZONE: ${WP_TIMEZONE:-UTC}
      WP_LOCALE: ${WP_LOCALE:-en_US}
      INSTALL_OPTIONAL_PLUGINS: ${INSTALL_OPTIONAL_PLUGINS:-0}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./scripts:/scripts:ro
      - ./content:/project-content:ro
      - ./policies:/project-policies:ro
      - ./docker/my.cnf:/root/.my.cnf:ro
    security_opt:
      - no-new-privileges:true

  wpcron:
    build:
      context: .
      dockerfile: docker/development/Dockerfile.wpcli
    image: longevity-wpcli:dev
    profiles: ["cron"]
    depends_on:
      wordpress:
        condition: service_healthy
    working_dir: /var/www/html
    entrypoint: ["sh", "/scripts/cron-wrapper.sh"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      LEL_CRON_FAILURE_THRESHOLD: ${LEL_CRON_FAILURE_THRESHOLD:-5}
      LEL_CRON_SLEEP_INTERVAL: ${LEL_CRON_SLEEP_INTERVAL:-300}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./scripts:/scripts:ro
    security_opt:
      - no-new-privileges:true

  test-runner:
    image: php@sha256:2a3f699b6cb31e5638c5432e4d37d4047853ba6351a692c91e0a073af00a55cc # php:8.3-cli
    profiles: ["test"]
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-longevity}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-longevity_app}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      PHP_VERSION: 8.3
    volumes:
      - .:/workspace:ro
      - ./reports:/workspace/reports:rw
    entrypoint: ["sh", "-c"]
    command: ["echo 'test-runner container ready. Use: docker compose run --rm --profile test test-runner php /workspace/tests/php/run-unit-tests.php'"]
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  wordpress_data:
  redis_data:
