name: Scheduled content validation
on:
  schedule:
    - cron: '31 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/validate-content.py
      - run: python3 scripts/validate-internal-links.py
      - run: python3 scripts/validate-freshness.py
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Content validation failed — ' + new Date().toISOString().split('T')[0],
              body: 'Weekly content validation workflow failed. Check the run at: ' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                    '/actions/runs/' + context.runId,
              labels: ['content', 'automation']
            });
