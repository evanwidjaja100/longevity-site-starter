name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  clean-build:
    name: Clean build and discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize evidence directory
        run: mkdir -p reports/clean-build && printf 'job=clean-build\ncommit=%s\n' "$GITHUB_SHA" > reports/clean-build/job.txt
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify locked dependency state
        run: bash scripts/verify-dependency-state.sh
      - name: Install exact dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Verify release manifest
        run: bash scripts/verify-manifest.sh
      - name: Verify critical test discovery
        run: php scripts/verify-test-discovery.php
      - name: Run dependency-free security fallback
        run: php tests/php/run-unit-tests.php
      - name: PHPUnit with coverage
        run: composer test -- --coverage-clover=coverage.xml --coverage-text
      - name: Check coverage threshold
        run: |
          COVERAGE=$(php -r '$d=simplexml_load_file("coverage.xml"); echo (float)$d->project->metrics["percentcoveredstatements"];')
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=${COVERAGE_THRESHOLD:-30}
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: clean-build-evidence
          path: |
            reports/clean-build/
            coverage.xml
          if-no-files-found: error

  quality-php:
    name: PHP quality
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize evidence directory
        run: mkdir -p reports/php-quality && printf 'job=quality-php\ncommit=%s\n' "$GITHUB_SHA" > reports/php-quality/job.txt
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/integration/*.sh
      - name: PHP syntax
        run: find wp-content/mu-plugins/longevity-core wp-content/themes/longevity-starter scripts tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer phpcs
      - run: composer phpstan
      - name: PHPUnit authoritative suite
        run: composer test -- --coverage-clover=coverage.xml --coverage-text
      - name: Check coverage threshold
        run: |
          COVERAGE=$(php -r '$d=simplexml_load_file("coverage.xml"); echo (float)$d->project->metrics["percentcoveredstatements"];')
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=${COVERAGE_THRESHOLD:-30}
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - run: composer audit --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: php-quality-evidence
          path: reports/php-quality/
          if-no-files-found: error

  quality-frontend:
    name: Frontend quality
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize evidence directory
        run: mkdir -p reports/frontend-quality && printf 'job=quality-frontend\ncommit=%s\n' "$GITHUB_SHA" > reports/frontend-quality/job.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-quality-evidence
          path: reports/frontend-quality/
          if-no-files-found: error

  content-and-config:
    name: Content and configuration
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize evidence directory
        run: mkdir -p reports/content-config && printf 'job=content-and-config\ncommit=%s\n' "$GITHUB_SHA" > reports/content-config/job.txt
      - run: bash scripts/ci-generate-env.sh
      - run: bash scripts/validate.sh
      - run: python3 scripts/validate-content.py
      - run: python3 scripts/validate-internal-links.py
      - run: python3 scripts/validate-freshness.py
      - run: docker compose config --quiet
      - run: bash scripts/verify-manifest.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: content-config-evidence
          path: reports/content-config/
          if-no-files-found: error

  wordpress-integration:
    name: WordPress integration
    needs: [quality-php, content-and-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/ci-generate-env.sh
      - name: Start WordPress
        run: docker compose up -d db wordpress
      - name: Bootstrap and smoke test
        run: |
          bash scripts/ci-setup.sh
          bash scripts/smoke-test.sh
      - name: Integration contracts
        run: |
          for script in tests/integration/*.sh; do
            bash "$script"
          done
      - name: Capture Docker logs
        if: failure()
        run: docker compose logs --no-color > docker-integration.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wordpress-integration-evidence
          path: |
            docker-integration.log
            reports/
          if-no-files-found: error
      - if: always()
        run: docker compose down -v

  playwright-chromium:
    name: Playwright Chromium
    needs: [quality-frontend, wordpress-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: bash scripts/ci-generate-env.sh && npm ci
      - run: docker compose up -d db wordpress
      - run: bash scripts/ci-setup.sh
      - run: npx playwright install --with-deps chromium
      - name: Core, routes, SEO, contact, a11y and security contracts
        env:
          WP_SITE_URL: http://localhost:8080
        run: npm run test:e2e:functional -- --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-chromium-evidence
          path: |
            reports/playwright/
            test-results/
            reports/ci-setup/
          if-no-files-found: error
      - if: always()
        run: docker compose down -v

  playwright-cross-browser:
    name: Critical Firefox and WebKit
    needs: [quality-frontend, wordpress-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: bash scripts/ci-generate-env.sh && npm ci
      - run: docker compose up -d db wordpress
      - run: bash scripts/ci-setup.sh
      - run: npx playwright install --with-deps firefox webkit
      - env:
          WP_SITE_URL: http://localhost:8080
        run: npx playwright test tests/e2e/critical-cross-browser.spec.js --project=firefox-critical --project=webkit-critical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-cross-browser-evidence
          path: |
            reports/playwright/
            test-results/
            reports/ci-setup/
          if-no-files-found: error
      - if: always()
        run: docker compose down -v

  visual-linux:
    name: Linux visual regression
    needs: [quality-frontend, wordpress-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/ci-generate-env.sh
      - run: docker compose up -d db wordpress
      - run: bash scripts/ci-setup.sh
      - name: Run visual suite in version-pinned Playwright image
        run: |
          docker run --rm --network host \
            -e WP_SITE_URL=http://localhost:8080 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            sh -lc 'npm ci && npx playwright test tests/e2e/visual.spec.js --project=chromium'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-linux-evidence
          path: |
            reports/playwright/
            reports/playwright-artifacts/
            test-results/
            reports/ci-setup/
          if-no-files-found: error
      - if: always()
        run: docker compose down -v

  lighthouse-mobile:
    name: Lighthouse mobile
    needs: [quality-frontend, wordpress-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: bash scripts/ci-generate-env.sh && npm ci
      - run: docker compose up -d db wordpress
      - run: bash scripts/ci-setup.sh
      - env:
          WP_SITE_URL: http://localhost:8080
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-evidence
          path: |
            reports/lighthouse/
            reports/ci-setup/
          if-no-files-found: error
      - if: always()
        run: docker compose down -v

  lighthouse-desktop:
    name: Lighthouse desktop
    needs: [quality-frontend, wordpress-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: bash scripts/ci-generate-env.sh && npm ci
      - run: docker compose up -d db wordpress
      - run: bash scripts/ci-setup.sh
      - env:
          WP_SITE_URL: http://localhost:8080
        run: npm run test:lighthouse:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-desktop-evidence
          path: |
            reports/lighthouse/desktop/
            reports/ci-setup/
          if-no-files-found: error
      - if: always()
        run: docker compose down -v

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize evidence directory
        run: mkdir -p reports/codeql && printf 'job=codeql\ncommit=%s\n' "$GITHUB_SHA" > reports/codeql/job.txt
      - uses: github/codeql-action/init@d03f4cc0498d5a63039d157eb274d9c2fc50f17a # v3.37.1
        with:
          languages: javascript, python, php
          queries: security-and-quality
      - uses: github/codeql-action/analyze@d03f4cc0498d5a63039d157eb274d9c2fc50f17a # v3.37.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: codeql-evidence
          path: reports/codeql/
          if-no-files-found: error

  security-supply-chain:
    name: Supply-chain and secret guards
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Initialize evidence directory
        run: mkdir -p reports/supply-chain && printf 'job=security-supply-chain\ncommit=%s\n' "$GITHUB_SHA" > reports/supply-chain/job.txt
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: composer audit --locked
      - run: npm audit --audit-level=high
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified --results=verified,unknown
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: config
          scan-ref: compose.yaml
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./
          format: spdx-json
          output-file: reports/sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            reports/sbom.spdx.json
            reports/supply-chain/
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize evidence directory
        run: mkdir -p reports/dependency-review && printf 'job=dependency-review\ncommit=%s\n' "$GITHUB_SHA" > reports/dependency-review/job.txt
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-review-evidence
          path: reports/dependency-review/
          if-no-files-found: error

  release-evidence:
    name: Release evidence index
    if: always()
    needs:
      - clean-build
      - quality-php
      - quality-frontend
      - content-and-config
      - wordpress-integration
      - playwright-chromium
      - playwright-cross-browser
      - visual-linux
      - lighthouse-mobile
      - lighthouse-desktop
      - codeql
      - security-supply-chain
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_EVIDENCE_AGGREGATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        with:
          path: reports/upstream
      - name: Record upstream job outcomes
        run: |
          mkdir -p reports
          cat > reports/ci-job-results.json <<'JSON'
          {
            "clean-build": "${{ needs.clean-build.result }}",
            "quality-php": "${{ needs.quality-php.result }}",
            "quality-frontend": "${{ needs.quality-frontend.result }}",
            "content-and-config": "${{ needs.content-and-config.result }}",
            "wordpress-integration": "${{ needs.wordpress-integration.result }}",
            "playwright-chromium": "${{ needs.playwright-chromium.result }}",
            "playwright-cross-browser": "${{ needs.playwright-cross-browser.result }}",
            "visual-linux": "${{ needs.visual-linux.result }}",
            "lighthouse-mobile": "${{ needs.lighthouse-mobile.result }}",
            "lighthouse-desktop": "${{ needs.lighthouse-desktop.result }}",
            "codeql": "${{ needs.codeql.result }}",
            "security-supply-chain": "${{ needs.security-supply-chain.result }}",
            "dependency-review": "${{ needs.dependency-review.result }}"
          }
          JSON
      - run: bash scripts/generate-release-evidence.sh "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-evidence-index
          path: |
            reports/ci-job-results.json
            reports/release/
          if-no-files-found: error
