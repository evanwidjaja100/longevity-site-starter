name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: PHP lint
        run: |
          find wp-content/mu-plugins/longevity-core wp-content/themes/longevity-starter scripts -name '*.php' -exec php -l {} \;
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: warning
      - name: Composer audit
        run: |
          if [ -f composer.lock ]; then composer audit; fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45  # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: PHPCS (WordPress Coding Standards)
        run: composer phpcs
      - name: PHPStan (static analysis)
        run: composer phpstan
      - name: PHPUnit
        run: composer phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: CodeQL initialization
        uses: github/codeql-action/init@d03f4cc0498d5a63039d157eb274d9c2fc50f17a  # v3.37.1
        with:
          languages: javascript, python, php
          queries: security-and-quality
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@d03f4cc0498d5a63039d157eb274d9c2fc50f17a  # v3.37.1
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        with:
          extra_args: --only-verified --results=verified,unknown

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4 (branch)
        with:
          fail-on-severity: high

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Trivy scan Docker compose
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          scan-type: config
          scan-ref: compose.yaml
          severity: HIGH,CRITICAL
          exit-code: 1

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: ./
          format: spdx-json
          output-file: reports/sbom.spdx.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Configure environment
        run: cp .env.ci .env
      - name: Start stack
        run: docker compose up -d db wordpress
      - name: Wait for WordPress to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker compose ps --format json wordpress | grep -o '"Health":"[a-z]*"' || echo "")
            echo "$status" | grep -q healthy && break
            sleep 5
          done
      - name: Bootstrap site
        run: docker compose run --rm --entrypoint sh wpcli /scripts/bootstrap.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright core suite
        env:
          WP_SITE_URL: http://localhost:8080
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: reports/playwright/
