name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45  # v2
        with: { php-version: '8.3', coverage: none }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '22', cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Record dependency scan start
        run: echo "DEPENDENCY_SCAN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Advisory reports
        run: |
          mkdir -p reports/security
          composer audit --locked --format=json > reports/security/composer-audit.json
          npm audit --audit-level=high --json > reports/security/npm-audit.json
      - name: PHP SAST detection and first-party scan
        run: |
          SAST_DETECTION_REPORT=reports/security/sast-detection.json bash scripts/verify-sast-detection.sh
          ./vendor/bin/psalm --taint-analysis --no-progress --no-cache --report=reports/security/psalm.sarif
      - name: SPDX SBOM and license policy
        run: php scripts/generate-dependency-sbom.php reports/security/sbom.spdx.json reports/security/licenses.json reports/security/scan-metadata.json
      - name: Reject tracked secrets and environment files
        run: |
          test ! -f .env
          ! git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[a-f0-9]{22,}_[A-Za-z0-9]{15,}|AKIA[0-9A-Z]{16})'
      - name: Check unsafe executable permissions
        run: |
          bad=$(find . -path ./.git -prune -o -type f -perm /022 -print)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Reject tracked database dumps and archives
        run: |
          bad=$(git ls-files | grep -E '\.(sql|sql\.gz|tgz|tar\.gz)$' || true)
          test -z "$bad" || { echo "Tracked backup/dump files found:"; echo "$bad"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scheduled-security-evidence
          path: reports/security/
          if-no-files-found: error
